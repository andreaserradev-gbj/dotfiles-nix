# Noctalia shell for the niri session on geekom.
#
# Noctalia merges every *.toml here with built-in defaults, then layers
# ~/.local/state/noctalia/settings.toml (written by its Settings UI) on top.
# So a setting changed in the GUI beats this file; clear that key or delete the
# state file to get the declarative value back.

[shell]
# Noctalia is the only polkit agent in a niri session: GNOME's lives inside
# gnome-shell, which is not running here.
polkit_agent = true
font_family = "JetBrainsMono Nerd Font"
# Type-to-launch from niri's overview, opt-in upstream.
niri_overview_type_to_launch_enabled = true

[theme]
mode = "dark"
source = "builtin"
# Matches the session's GTK side: Papirus-Dark icons (modules/home/gtk.nix)
# and ghostty's Catppuccin Mocha (modules/home/desktop.nix).
builtin = "Catppuccin"

[wallpaper]
enabled = true
# Wallpapers are user-managed in ~/Pictures/Wallpapers now; the Settings UI's
# state file (~/.local/state/noctalia/settings.toml) overrides this default.
[wallpaper.default]
path = "~/Pictures/Wallpapers/3d-render-bloom-3840x2160-27150.jpg"

[backdrop]
enabled = true

[lockscreen]
enabled = true

# One session, one user: the lock screen's session switcher is dead UI. The
# key lives on the login-box WIDGET in 5.0.1 (verified with `noctalia config
# export`), not on [lockscreen]; `type` is required for the widget record to
# be recognized at all. The Settings UI persists the same widget block in
# ~/.local/state/noctalia/settings.toml, which merges after this file and
# wins — clear its show_session_buttons key there to let this apply.
[lockscreen_widgets.widget."lockscreen-login-box@DP-6"]
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-6".settings]
show_session_buttons = false

[notification]
enable_daemon = true

# No suspend entries: geekom masks sleep.target and suspend.target
# (hosts/geekom/default.nix), so "Lock & Suspend" would fail with
# "Call to Suspend failed: Access denied".
[shell.session]
grid = false

[[shell.session.actions]]
action = "lock"

[[shell.session.actions]]
action = "logout"

[[shell.session.actions]]
action = "reboot"

[[shell.session.actions]]
action = "shutdown"
variant = "destructive"

# Captures go to their own folder instead of Noctalia's default (~/Pictures,
# alongside wallpapers). Noctalia creates the directory on capture; the
# default filename pattern (screenshot_%Y%m%d_%H%M%S) needs no override.
[shell.screenshot]
directory = "~/Pictures/Screenshots"
