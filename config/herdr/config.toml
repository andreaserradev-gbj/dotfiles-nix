# herdr — terminal workspace manager for coding agents.
#
# Nix-managed copy (modules/home/herdr.nix symlinks it into place). Knob-by-knob
# rationale, the keymap's zellij mirroring and the gotchas: doc/herdr.md; this
# file is the source of truth for the bindings themselves.
# alt+d for split_horizontal mirrors zellij's pane-mode "d" (NewPane "down")
# — a stacked split, exactly what alt+d does in zellij's pane mode.
# No quit key exists in herdr — prefix+q detaches; closing the server is a
# CLI action, not a keybinding (documented gap).
onboarding = false

# Two phone-home knobs, both curl-based (upstream src/app/mod.rs):
# - `version_check` GETs the releases API on every launch and announces a
#   version this install cannot take (the store path is read-only, so `herdr
#   update` is inert under Nix). OFF here; version bumps are the tool-pins.json
#   entry, bumped by nfb.
# - `manifest_check` refreshes the agent-detection manifests from
#   herdr.dev/agent-detection/index.toml. Deliberately LEFT ON: the agent
#   registry is why this tool is here, and turning it off freezes detection at
#   the manifests shipped with the binary.
[update]
version_check = false

[theme]
name = "catppuccin"

[keys]
focus_pane_left  = ["prefix+alt+h", "alt+left"]
focus_pane_down  = ["prefix+alt+j", "alt+down"]
focus_pane_up    = ["prefix+alt+k", "alt+up"]
focus_pane_right = ["prefix+alt+l", "alt+right"]
split_vertical   = ["alt+n"]
split_horizontal = ["alt+d"]
zoom             = ["alt+f"]
new_tab          = ["alt+t"]
next_tab         = ["alt+shift+right"]
previous_tab     = ["alt+shift+left"]