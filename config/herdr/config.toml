# herdr — terminal workspace manager for coding agents.
#
# Nix-managed copy (modules/home/herdr.nix symlinks it into place). Originally
# proven during the Phase 0 ephemeral trial (2026-09): keymap verified live,
# `herdr config check` passed, strace showed zero network connects.
#
# Keymap mirrors zellij's alt-direct nav (modules/home/zellij.nix config.kdl):
# every action carries BOTH the herdr prefix chord and the bare alt single,
# so muscle memory carries over without nesting one manager in the other.
# alt+d for split_horizontal mirrors zellij's pane-mode "d" (NewPane "down")
# — a stacked split, exactly what alt+d does in zellij's pane mode.
# No quit key exists in herdr — prefix+q detaches; closing the server is a
# CLI action, not a keybinding (documented gap, doc/herdr.md).
onboarding = false

# The only phone-home knob. strace-verified during the trial: false → zero
# AF_INET connects. The binary itself cannot self-update under Nix (store
# path is read-only); version bumps are flake-side (?ref=vX.Y.Z + nix flake
# lock — see doc/herdr.md).
[update]
version_check = false

[theme]
name = "catppuccin"

[keys]
focus_pane_left  = ["prefix+alt+h", "alt+h"]
focus_pane_down  = ["prefix+alt+j", "alt+j"]
focus_pane_up    = ["prefix+alt+k", "alt+k"]
focus_pane_right = ["prefix+alt+l", "alt+l"]
split_vertical   = ["alt+n"]
split_horizontal = ["alt+d"]
zoom             = ["alt+f"]
new_tab          = ["alt+t"]
next_tab         = ["alt+o"]
previous_tab     = ["alt+i"]