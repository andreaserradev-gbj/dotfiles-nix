# sops recipient policy. This file is NOT secret — it lists public keys
# only. It tells `sops` which keys to encrypt to when a file under
# creation_rules is created or re-encrypted.
#
# TRUST BOUNDARY: hplaptop (Elisa's machine) is deliberately absent from
# every rule. It can never decrypt anything under secrets/andrea/, and it
# declares no sops.secrets (see the sops block in modules/nixos/dev.nix,
# which lives inside the local.dev.enable gate).
# A future "elisa" namespace would get its own path_regex + key_groups —
# documented in doc/secrets.md, added only when a real need exists.
#
keys:
  # Andrea's personal age key (~/.config/sops/age/keys.txt, sops default
  # location). Lets Andrea edit secrets from any machine without the
  # SSH host keys of every recipient being present.
  - &andrea age10p2fkelpq7fdftas46spr9kduzz3qnjsc2fvlvqt3f3l0q4gc9fq74d7w4
  # geekom host key (ssh-to-age of /etc/ssh/ssh_host_ed25519_key.pub)
  - &geekom age137fqs8tl3uddh26gpa3rtdnxv5v059cnkzp2tmh4e22674k03yaqc8h2m9
  # nixos VM host key: DELIBERATELY ABSENT. The VM is dormant (README's host
  # list), so no machine holds that key, and a reinstall generates a fresh
  # one — doc/secrets.md covers adding the new key to this list.

creation_rules:
  # Andrea's secrets: encrypted to Andrea's personal key and geekom's.
  #
  # SHAMIR TRAP: a `key_groups` list must hold exactly ONE `- age:` item. A
  # second `- age:` entry makes sops treat them as separate groups and split
  # the data key with shamir, so each group holds only a share and no single
  # host can decrypt alone. The (unindented) `- age:` below is that one item:
  # every recipient in its list fully wraps the data key.
  - path_regex: secrets/andrea/.*\.yaml$
    key_groups:
    - age:
      - *andrea
      - *geekom
