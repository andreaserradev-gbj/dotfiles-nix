# CI for the flake, in four stages: evaluate (the multi-host drvPath gate) ->
# build (only the hosts whose drvPath moved) -> gate (the single required
# check) -> advance-verified (moves `verified` behind a green gate).
# Rationale for all four stages, the GitHub-side settings this file cannot
# assert, and the drift/60-minute-timeout warning: doc/workflow.md, section CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Two quick pushes to `main` must not race: the older run finishes last and its
# advance-verified push would be a non-fast-forward, turning a healthy pipeline
# red. They queue instead. On a PR a new push makes the previous run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; only advance-verified re-grants write, at job scope.
permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      hosts: ${{ steps.changed.outputs.hosts }}
    steps:
      # Third-party actions are pinned to a full commit SHA, with the tag in the
      # trailing comment as the human bump handle: a tag is a movable ref, and a
      # compromised or retagged action runs with this workflow's token. No
      # dependabot here, so bumping is manual (doc/workflow.md, section CI).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # determinate: false — the hosts run stock Nix, so CI must verify against
      # what they actually run.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
      # treefmt check mode: fails on any unformatted file, including ones the
      # local pre-commit hook never saw.
      - run: nix fmt -- --ci
      # statix and deadnix gate ONLY here and in the devShell — the pre-commit
      # hook runs nixfmt alone. `--fail` is what makes deadnix a gate at all.
      - run: nix develop -c statix check .
      - run: nix develop -c deadnix --fail
      - run: ./scripts/check-hosts.sh
      # The candidates are named HERE, not in changed-hosts.sh, so this file
      # stays the one place that says what CI builds. The baseline fetch needs a
      # token so it does not share the rate-limited anonymous pool Actions
      # runners draw from; the installer action already supplies one —
      # `github-token` defaults to `${{ github.token }}` and it writes
      # `access-tokens` into /etc/nix/nix.conf (its src/index.ts, pinned v22).
      - id: changed
        run: |
          hosts="$(./scripts/changed-hosts.sh verified geekom hplaptop)"
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"
          echo "build matrix: $hosts"

  build:
    needs: evaluate
    # An empty matrix is not a valid strategy, so skip the job outright.
    if: needs.evaluate.outputs.hosts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        host: ${{ fromJSON(needs.evaluate.outputs.hosts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same determinate: false reasoning as the evaluate job.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
      - run: >
          nix build
          ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
          --print-build-logs

  # The one required status check: it always runs, so it always reports, and
  # `skipped` is an ACCEPTED build result (no host moved = already built green).
  # `cancelled` and `failure` are not.
  gate:
    needs: [evaluate, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          EVALUATE: ${{ needs.evaluate.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "evaluate=$EVALUATE build=$BUILD"
          [ "$EVALUATE" = "success" ] || { echo "!! evaluate did not pass"; exit 1; }
          case "$BUILD" in
            success|skipped) ;;
            *) echo "!! build result '$BUILD' is not acceptable"; exit 1 ;;
          esac
          echo "gate: pass"

  # Fast-forward `verified`, but only behind a green gate: `verified` must never
  # name a commit whose x86_64 hosts were not built here or proven identical.
  # Push-to-main only — on a pull_request the checkout is a merge commit that
  # exists nowhere afterwards, and GITHUB_TOKEN is read-only for forks.
  advance-verified:
    needs: gate
    # `always()` is load-bearing and must not be "tidied away": a skipped job
    # propagates skip TRANSITIVELY through the needs graph, so without it every
    # doc- or CI-only commit silently fails to advance `verified`. always() alone
    # also runs on cancellation, so the gate result is asserted explicitly below.
    if: >-
      always()
      && needs.gate.result == 'success'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The one job that needs write; scoped here so evaluate/build stay read-only.
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 — pushing a shallow clone is only reliable when the remote
      # already has every object being sent; the repo is small, so just clone all.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Non-forced, deliberately: a diverged `verified` is REJECTED rather than
      # rewritten, so a red advance-verified means a host stays where it is, not
      # that it installs something unbuilt.
      - run: git push origin HEAD:verified
