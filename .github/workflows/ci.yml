# CI for the flake. What runs and why:
#
# 1. evaluate — check-hosts.sh evaluates all three hosts. Evaluation is
#    arch-independent, so the aarch64 VM (`nixos`) is covered here too,
#    on an x86_64 runner, at zero build cost. This is the same gate used
#    locally, on purpose: a config that fails it should fail identically
#    on both. The job also runs the formatter and the two Nix linters —
#    see the comments on those steps.
#
# 2. build matrix (geekom, hplaptop) — full toplevel builds. Only
#    hplaptop updates *from GitHub unattended* (see doc/workflow.md);
#    geekom is rebuilt by hand and is in the matrix because it is the
#    other x86_64 host whose build cost is real and whose breakage would
#    otherwise surface only at the next manual `nrb`. For hplaptop the
#    point of CI is to surface a broken commit within minutes of it
#    landing on `main`, before the next unattended `nrb` picks it up —
#    it does not retroactively remove one, and an `nrb` that races the
#    build can still install it. The aarch64 VM is deliberately NOT
#    built: it is local-first (rebuilt interactively with check-hosts.sh
#    in front), and emulating a GNOME toplevel under QEMU would cost ~1h
#    of CI per push for no risk reduction.
#
# 3. advance-verified — fast-forwards the `verified` branch to a `main`
#    commit whose whole build matrix went green. The branch is the
#    intended pull target for the unattended host, so that an `nrb` can
#    only ever pick up a commit CI has already built. NOTE: hplaptop
#    still pulls `main` today (modules/home/maintenance.nix) — the
#    repoint to `verified` is a separate change; until it lands this job
#    maintains the branch without anything consuming it.
#
# Builds substitute almost entirely from cache.nixos.org because both
# hosts pin stable 26.05 — if the "fetched" lines disappear and jobs
# start compiling, an input has drifted off the stable channel and DRIFT
# should be investigated, not disk space freed up. The 60-minute timeout
# bounds exactly that drift scenario; a normal substituted build takes
# ~10. If space ever does run out, add the runner-cleanup step from
# https://github.com/actions/runner-images#available-images manually;
# do not add it preemptively.
#
# TWO ASSUMPTIONS LIVE ON GITHUB, NOT IN THIS FILE — neither is
# verifiable from a clone, and both silently degrade the gate if changed:
#
#   a. Settings -> Actions -> General -> Workflow permissions must be
#      "Read repository contents and packages permissions" (the
#      read-only default). The workflow-level `permissions:` below
#      narrows to that explicitly, and advance-verified re-grants
#      `contents: write` for its job alone. If the repo-wide setting is
#      ever flipped to read-write, every other job silently gains a
#      write token it does not need — this file cannot detect that.
#
#   b. Branch protection on `main` (require this workflow to pass before
#      merge) is configured in the GitHub UI. Nothing in the repo
#      asserts it, and nothing here fails if it is removed. Without it
#      CI is advisory on `main`: red runs still merge, and
#      advance-verified simply does not fire, so `verified` quietly
#      stops advancing rather than loudly breaking.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. Only advance-verified overrides this, at job
# scope, and only to push the `verified` ref.
permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to a full commit SHA: a tag is a
      # movable ref, and a compromised or retagged action runs with this
      # workflow's token. The tag in the trailing comment is the human
      # bump handle — there is no dependabot here, so bumping is manual:
      # resolve with `git ls-remote --tags <repo>` and replace both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v22+ defaults to installing *Determinate* Nix (flakehub integration and
      # its GHA-backed cache). Two reasons to turn that off here: the hosts run
      # stock Nix, so CI should verify against what they actually run; and the
      # Determinate cache layer emits "Failed to save/restore: Cache service
      # …" warnings on every run when GitHub's cache service hiccups. We fetch
      # straight from cache.nixos.org (nothing expensive or custom to cache).
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
      # treefmt check mode: fails on any unformatted file, format or not.
      # Small enough to piggyback here — the runner already has Nix, and a
      # formatting break should block the same way an evaluation break does.
      # (The local pre-commit hook only covers what is being committed; this
      # catches everything, e.g. a hook skipped with --no-verify. On a local
      # dirty tree, treefmt's git walk skips untracked files instead — in a
      # fresh CI checkout every file is tracked, so the gap is CI-only.)
      - run: nix fmt -- --ci
      # statix and deadnix run ONLY here and in the devShell — the pre-commit
      # hook runs nixfmt alone, so this is the only place either one gates.
      # Both come from the flake's devShell, so CI and `nix develop` use the
      # same pinned versions. statix's disabled-lint list lives in statix.toml
      # (load-bearing: a TOML parse error there makes the whole list inert).
      # deadnix --fail turns findings into a non-zero exit; without it deadnix
      # reports and exits 0, which is a report, not a gate.
      - run: nix develop -c statix check .
      - run: nix develop -c deadnix --fail
      - run: ./scripts/check-hosts.sh

  build:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        host: [geekom, hplaptop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same determinate: false reasoning as the evaluate job.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
      - run: >
          nix build
          ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
          --print-build-logs

  # Fast-forward `verified` to this commit once the whole matrix is green.
  # `needs: build` is the entire point: `verified` must never name a commit
  # that has not been built for both x86_64 hosts.
  #
  # Push-to-main only. On a pull_request the checked-out ref is a merge
  # commit that exists nowhere afterwards, and GITHUB_TOKEN is read-only for
  # forks — advancing `verified` from there would be both wrong and
  # impossible.
  advance-verified:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The one job that needs write. Scoped here rather than at workflow level
    # so evaluate/build keep a read-only token.
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 — the default depth-1 checkout is a shallow clone, and
      # pushing one is only reliable when the remote already has every object
      # being sent. It does here (HEAD is the main commit that just pushed),
      # but the repo is small enough that a full clone costs nothing and
      # removes the question entirely.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Non-forced: if `verified` has somehow diverged from main's history the
      # push is REJECTED rather than rewritten. That is the safe failure — a
      # red advance-verified means someone should look, not that a host is
      # about to install something unbuilt (hosts just stay where they are).
      - run: git push origin HEAD:verified
